[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macagent"
version = "0.1.0"
description = "Natural language macOS automation agent"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "MacAgent Contributors"}]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.6.0",
]

[project.scripts]
macagent = "macagent.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"macagent.tools" = ["*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
